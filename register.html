<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="main-container">
        <div class="auth-card register-mode">
            <h1>Create Account</h1>
            <form action="server.html" method="get" target="result_frame">
                <div class="form-grid">
                    <div class="input-group">
                        <label for="username">Username *</label>
                        <input type="text" id="username" name="username" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="firstname">First Name *</label>
                        <input type="text" id="firstname" name="firstname" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="lastname">Last Name *</label>
                        <input type="text" id="lastname" name="lastname" required>
                    </div>
                </div>
                
                <div class="input-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="input-group">
                    <label for="confirm_email">Confirm Email *</label>
                    <input type="email" id="confirm_email" name="confirm_email" required>
                </div>
                
                <div class="input-group">
                    <label for="password">Password *</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <div class="input-group">
                    <label>Gender *</label>
                    <div class="gender-options">
                        <label class="radio-item">
                            <input type="radio" name="gender" value="male" required>
                            <span>Male</span>
                        </label>
                        <label class="radio-item">
                            <input type="radio" name="gender" value="female" required>
                            <span>Female</span>
                        </label>
                    </div>
                </div>
                
                <button type="submit" class="btn-primary">Complete Registration</button>
                
                <p class="auth-footer">
                    Already have an account? <a href="index.html">Sign in here</a>
                </p>
            </form>
            
            <div class="help-section">
                <h2>Registration Status</h2>
                <iframe src="instructions.html" name="result_frame" title="Registration Instructions and Results"></iframe>
            </div>
        </div>
    </div>
</body>
</html>
